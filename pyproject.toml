[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flask_app"
version = "0.1.0"
description = "reusable Flask template that can easily switch to production"
dependencies = [
    "flask>=3.0.0",
    "waitress>=3.0.0",
    "python-dotenv>=1.0.0"
]