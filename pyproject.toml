[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-tracker"
version = "0.1.0"
description = "Personal Tracker using Garmin API"
dependencies = [
    "flask>=3.0.0",
    "waitress>=3.0.0",
    "python-dotenv>=1.0.0"
    "garmin-connect-personal-api-python>=1.0.0"
]