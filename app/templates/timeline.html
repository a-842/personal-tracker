<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Daily Timeline</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h2>Activity Timeline</h2>

    {% for day_data in days_data %}
        <div class="day-card">
            <div class="date-header">{{ day_data[0] }}</div>
            <div class="timeline-track">
                {% for activity in day_data[1] %}
                <div class="activity-bar" 
                    style="left: {{ activity[0] }}%; width: {{ activity[1] }}%;">
                    {{ activity[2] }}
                </div>
                {% endfor %}
            </div>
        </div>
    {% endfor %}


</body>
</html>
